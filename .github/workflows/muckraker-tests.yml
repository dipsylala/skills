name: muckraker tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: mr.py tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # the official Python images, since setup-python has no 3.9 build for current Ubuntu runners
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3"]  # mr.py promises 3.9 or later; "3" is the latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the offline tests
        run: python -m unittest muckraker/scripts/test_mr.py
